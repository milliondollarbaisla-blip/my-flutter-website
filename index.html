<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mistri - Search Services</title>
  <style>
    body { background-color: #0F172A; color: #F8FAFC; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px 15px; margin: 0; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { color: #38BDF8; margin: 0; font-size: 28px; }
    .search-box { background: #1E293B; padding: 12px 18px; border-radius: 12px; display: flex; align-items: center; margin-bottom: 20px; border: 1px solid #334155; }
    .search-box input { background: transparent; border: none; color: white; width: 100%; font-size: 16px; outline: none; }
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
    .cat-card { background: #1E293B; border: 1px solid #334155; padding: 10px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 14px; }
    .cat-card.active { background: #0284C7; border-color: #38BDF8; }
    .mistri-card { background: #1E293B; padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .info h3 { margin: 0 0 4px 0; font-size: 18px; color: #F8FAFC; }
    .info p { margin: 0; color: #94A3B8; font-size: 13px; }
    .rating { background: #0369A1; color: #7DD3FC; padding: 4px 8px; border-radius: 8px; font-weight: bold; font-size: 13px; }
    .book-btn { background: #38BDF8; color: #0F172A; padding: 8px 16px; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Mistri 🛠️</h1>
      <span style="color: #94A3B8; font-size: 13px;">Delhi, India</span>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Plumber, Electrician..." onkeyup="filterMistri()">
    </div>

    <div class="categories">
      <div class="cat-card active" onclick="filterCat('All')">All</div>
      <div class="cat-card" onclick="filterCat('Plumber')">Plumbers</div>
      <div class="cat-card" onclick="filterCat('Electrician')">Electricians</div>
      <div class="cat-card" onclick="filterCat('Carpenter')">Carpenters</div>
    </div>

    <div id="mistriList"></div>
  </div>

  <script>
    const mistris = [
      { name: "Ramesh Kumar", service: "Plumber", exp: "5 Yrs Exp", rate: "★ 4.8", price: "₹299" },
      { name: "Suresh Sharma", service: "Electrician", exp: "8 Yrs Exp", rate: "★ 4.9", price: "₹349" },
      { name: "Amit Verma", service: "Carpenter", exp: "4 Yrs Exp", rate: "★ 4.6", price: "₹399" },
      { name: "Vikram Singh", service: "Plumber", exp: "6 Yrs Exp", rate: "★ 4.7", price: "₹249" }
    ];

    function renderList(data) {
      const list = document.getElementById('mistriList');
      list.innerHTML = data.map(m => `
        <div class="mistri-card">
          <div class="info">
            <h3>${m.name}</h3>
            <p>${m.service} • ${m.exp}</p>
            <button class="book-btn">Book (${m.price})</button>
          </div>
          <div class="rating">${m.rate}</div>
        </div>
      `).join('');
    }

    function filterMistri() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = mistris.filter(m => m.name.toLowerCase().includes(q) || m.service.toLowerCase().includes(q));
      renderList(filtered);
    }

    function filterCat(cat) {
      if (cat === 'All') renderList(mistris);
      else renderList(mistris.filter(m => m.service === cat));
    }

    renderList(mistris);
  </script>
</body>
</html>
