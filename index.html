<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINELEAK - AI Reel Audio & Caption Hook Generator</title>
  <style>
    :root {
      --bg-deep: #080813;
      --neon-green: #00ff66;
      --ig-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #a0a0ab;
    }

    body.oled-black {
      --bg-deep: #000000;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      transition: background-color 0.3s ease;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      font-weight: 800;
      font-size: 1.5rem;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Filter Chips */
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar {
      display: none;
    }
    .chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip.active {
      color: var(--text-main);
      border-color: var(--neon-green);
      background: rgba(0, 255, 102, 0.08);
    }

    /* Audio Waveform Visualizer */
    .waveform-container {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 36px;
      background: rgba(0,0,0,0.2);
      padding: 0 12px;
      border-radius: 8px;
      margin: 12px 0;
    }
    .wave-bar {
      flex: 1;
      background: var(--neon-green);
      border-radius: 2px;
      animation: pulseWave 1.2s infinite ease-in-out alternate;
    }
    @keyframes pulseWave {
      0% { height: 6px; opacity: 0.4; }
      100% { height: 28px; opacity: 1; }
    }

    .ai-prompt-input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      margin-bottom: 12px;
    }
    .ai-prompt-input:focus {
      border-color: var(--neon-green);
    }

    /* Buttons & Actions */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: var(--ig-gradient);
      color: white;
    }
    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }
    .action-btn:hover {
      opacity: 0.9;
    }

    /* Toast Alert Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1a1a2e;
      border: 1px solid var(--neon-green);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,255,102,0.2);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
    .toast-dot {
      width: 8px;
      height: 8px;
      background: var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-green);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo">LINELEAK</div>
      <button class="theme-toggle-btn" id="themeToggle" onclick="toggleOLEDTheme()">OLED Black: OFF</button>
    </header>

    <!-- Hook Categorization Filters -->
    <div class="filter-chips" id="filterChips">
      <div class="chip active" onclick="setCategory('Viral', this)">Viral</div>
      <div class="chip" onclick="setCategory('Educational', this)">Educational</div>
      <div class="chip" onclick="setCategory('Storytelling', this)">Storytelling</div>
      <div class="chip" onclick="setCategory('Direct Response', this)">Direct Response</div>
    </div>

    <!-- Generator Interface Card -->
    <div class="glass-card">
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">CUSTOM TOPIC / NICHE</p>
      <input type="text" id="userTopic" class="ai-prompt-input" placeholder="e.g. Real Estate, Fitness, Coding tips..." value="Instagram Growth">

      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">AI GENERATED HOOK PREVIEW</p>
      <h3 id="hookOutputText" style="font-size: 1.1rem; line-height: 1.4; margin-bottom: 12px;">"Nobody is talking about this hidden algorithm update..."</h3>

      <!-- Audio Waveform Visualizer -->
      <div class="waveform-container" id="waveformPreview">
        <div class="wave-bar" style="animation-delay: 0.1s;"></div>
        <div class="wave-bar" style="animation-delay: 0.3s;"></div>
        <div class="wave-bar" style="animation-delay: 0.2s;"></div>
        <div class="wave-bar" style="animation-delay: 0.5s;"></div>
        <div class="wave-bar" style="animation-delay: 0.2s;"></div>
        <div class="wave-bar" style="animation-delay: 0.4s;"></div>
        <div class="wave-bar" style="animation-delay: 0.1s;"></div>
        <div class="wave-bar" style="animation-delay: 0.3s;"></div>
      </div>

      <button class="action-btn btn-primary" style="width: 100%; margin-bottom: 10px;" onclick="generateAIHook()">Generate AI Hook ✨</button>

      <div class="btn-group">
        <button class="action-btn btn-secondary" onclick="copyHookToClipboard()">Copy Hook</button>
        <button class="action-btn btn-secondary" onclick="downloadSRT()">Export .SRT</button>
      </div>
    </div>
  </div>

  <!-- Copy-to-Clipboard Toast Alert -->
  <div class="toast" id="clipboardToast">
    <div class="toast-dot"></div>
    <span>Hook copied to clipboard!</span>
  </div>

  <script>
    let currentCategory = 'Viral';
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"; // Replace with your Google AI Studio API Key

    function toggleOLEDTheme() {
      const body = document.body;
      const btn = document.getElementById('themeToggle');
      body.classList.toggle('oled-black');
      const isOLED = body.classList.contains('oled-black');
      btn.textContent = isOLED ? 'OLED Black: ON' : 'OLED Black: OFF';
    }

    function setCategory(category, element) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      currentCategory = category;
    }

async function generateAIHook() {
  const topic = document.getElementById('userTopic').value || "general growth";
  const outputEl = document.getElementById('hookOutputText');
  outputEl.textContent = "Training AI & Generating...";

  if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
    outputEl.textContent = `"Please update your Gemini API key in the JavaScript code!"`;
    return;
  }

  // Yahan aap AI ko train karne ke liye apni pasand ke examples de rahe hain (Few-shot prompting)
  const systemInstruction = "You are an expert Instagram Reel and TikTok copywriter. Your hooks must be ultra-catchy, under 15 words, curiosity-driven, and stop the scroll instantly.";
  
  const prompt = `Category: ${currentCategory}
  Topic: ${topic}
  
  Here are examples of the exact style and tone I want:
  - "Nobody is talking about this secret hack for ${topic}..."
  - "I tried ${topic} for 7 days and the results broke my analytics..."
  - "Stop scrolling if you want to master ${topic} in under a week..."

  Generate ONE new, highly engaging hook for the topic "${topic}" following the above style. Return ONLY the raw hook text inside quotation marks.`;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemInstruction }] },
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();
    const aiText = data.candidates[0].content.parts[0].text.trim();
    outputEl.textContent = aiText;
  } catch (error) {
    outputEl.textContent = `"Error connecting to Gemini AI. Check your API key."`;
  }
}

        const data = await response.json();
        const aiText = data.candidates[0].content.parts[0].text.trim();
        outputEl.textContent = aiText;
      } catch (error) {
        outputEl.textContent = `"Error connecting to Gemini AI. Check your API key or network."`;
      }
    }

    function copyHookToClipboard() {
      const textToCopy = document.getElementById('hookOutputText').textContent;
      navigator.clipboard.writeText(textToCopy).then(() => {
        const toast = document.getElementById('clipboardToast');
        toast.classList.add('show');
        if (window.navigator && window.navigator.vibrate) {
          window.navigator.vibrate(40);
        }
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2000);
      });
    }

    function downloadSRT() {
      const text = document.getElementById('hookOutputText').textContent.replace(/"/g, '');
      const srtContent = `1\n00:00:00,000 --> 00:00:03,500\n${text}\n\n2\n00:00:03,500 --> 00:00:06,000\n✨ Tap follow for part 2!`;
      
      const blob = new Blob([srtContent], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lineleak-caption.srt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
