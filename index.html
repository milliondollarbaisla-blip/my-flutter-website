<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINELEAK - Line Generator</title>
  <style>
    body { background-color: #120E1B; color: #F7F3E9; font-family: sans-serif; text-align: center; padding: 30px 15px; margin: 0; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 32px; margin-bottom: 20px; }
    .leak { color: #D4FF3D; }
    .hero { background: linear-gradient(135deg, #8A5CFF, #FF3366); padding: 25px; border-radius: 20px; text-align: left; margin-bottom: 25px; }
    .hero h2 { margin: 0 0 10px 0; font-size: 22px; }
    .hero p { margin: 0; opacity: 0.8; font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
    .chip { background: transparent; border: 1.5px solid #F7F3E9; color: #F7F3E9; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .chip.active { background: #F7F3E9; color: #120E1B; }
    .card { background: #1B1626; padding: 30px 20px; border-radius: 20px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
    .tag { color: #D4FF3D; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
    .line-box { font-size: 20px; font-weight: bold; margin: 20px 0; min-height: 60px; line-height: 1.4; display: flex; align-items: center; justify-content: center; }
    .btn { background: #D4FF3D; color: #120E1B; padding: 12px 28px; border: none; font-weight: 800; border-radius: 30px; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .btn:active { transform: scale(0.95); }
    .subtext { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>LINE<span class="leak">LEAK</span></h1>
    <div class="hero">
      <h2>Ek line, poora reel ka comment section bhar de.</h2>
      <p>Random Hinglish brainrot lines — reels pe chipkao, screenshot bano, aur comments padho.</p>
    </div>
    
    <div class="chips" id="chipsContainer"></div>

    <div class="card">
      <div id="catTag" class="tag">RANDOM</div>
      <div id="lineText" class="line-box">Button daba ke dekho, dimaag thoda ghoomega.</div>
      <div class="subtext">(Text ko copy kar sakte ho)</div>
      <br>
      <button class="btn" id="generateBtn">🎲 Naya nikaalo</button>
    </div>
  </div>

  <script>
    const data = {
      'Rishta / Shaadi': [
        'Swarg toh chala jaayega bandaa, par wahaan bhi bandi nahi milegi.',
        'Biwi se zubaan ladaane ka maza hi alag hai — jeetne ka toh sawaal hi nahi.',
        'Shaadi woh laddu hai jo khaye wo bhi roye, jo na khaye wo bhi roye.'
      ],
      'Parents / Ghar': [
        "Mummy ka ek hi dialogue — 'padhai chhod ke sab yaad hai.'",
        'Ghar mein Wi-Fi password se zyada secret papa ki salary hai.',
        'Mummy: Rishtedaar aa rahe hain, ghar saaf karo!'
      ],
      'Dosti': [
        'Dost woh hota hai jo tumhari galti pe sabse zyada haste — sabse pehle.',
        'Bhai tu bas haan bol, Baaki aage dekh lenge.',
        'Chai pine chale? — Aise dosto se hi desh chal raha hai.'
      ],
      'Adulting / Job': [
        'Salary aati hai, dikhti bhi nahi, bas account chhoo ke nikal jaati hai.',
        'Monday morning motivation: Resign letter tayar rakhna.',
        'HR: Tell me about yourself. Me: I need money.'
      ],
      'Random Chaos': [
        'Zindagi ek WiFi hai — signal full dikhta hai, load kuch nahi hota.',
        'Dimaag kharab hone pe 5 minute shaant rehne se ghanta kuch nahi hota.'
      ],
      'Spicy Extra': [
        'Pyaar mein sab jayaz hai, bas UPI history clear rakhna.',
        'Ek taraf ka pyaar aur ek taraf ka loan — dono ki EMI zindagi bhar chalti hai.'
      ]
    };

    let selectedCat = 'Random';
    const categories = ['Random', ...Object.keys(data)];

    function renderChips() {
      const container = document.getElementById('chipsContainer');
      container.innerHTML = categories.map(cat => 
        `<button class="chip ${cat === selectedCat ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>`
      ).join('');
    }

    function selectCategory(cat) {
      selectedCat = cat;
      renderChips();
      generateLine();
    }

    function generateLine() {
      let pool = [];
      if (selectedCat === 'Random') {
        Object.values(data).forEach(arr => pool.push(...arr));
      } else {
        pool = data[selectedCat];
      }
      const randomIndex = Math.floor(Math.random() * pool.length);
      document.getElementById('lineText').innerText = pool[randomIndex];
      document.getElementById('catTag').innerText = selectedCat.toUpperCase();
    }

    // Event Listener setup
    document.getElementById('generateBtn').addEventListener('click', generateLine);

    // Initial render
    renderChips();
  </script>
</body>
</html>
