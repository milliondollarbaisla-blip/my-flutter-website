<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LINELEAK - The Ultimate Reel Audio & Caption Hook Generator</title>
  <style>
    :root {
      --bg-dark: #080813;
      --card-bg: #161224;
      --ig-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      --accent-pink: #E1306C;
      --neon-green: #D4FF3D;
      --text-main: #F7F3E9;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 20px 15px;
      margin: 0;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* iOS Safari fixes for select dropdowns */
    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-color: var(--card-bg);
      color: var(--text-main);
      opacity: 1;
      width: 100%;
      padding: 12px 35px 12px 15px;
      border: 1px solid #332a4d;
      border-radius: 8px;
      font-size: 16px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
    }

    select option {
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    /* Top Navigation / Auth Styling */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-btn {
      background: var(--ig-gradient);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid #332a4d;
      border-radius: 12px;
      padding: 25px;
      width: 90%;
      max-width: 400px;
      text-align: left;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 20px;
      cursor: pointer;
    }

    .modal-title {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #332a4d;
      background: var(--bg-dark);
      color: var(--text-main);
      font-size: 14px;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--ig-gradient);
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .toggle-auth {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #aaa;
    }

    .toggle-auth span {
      color: var(--accent-pink);
      cursor: pointer;
      text-decoration: underline;
    }

    .step-section {
      display: none;
    }

    .step-section.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="logo">LINELEAK</div>
      <button class="auth-btn" id="auth-trigger-btn" onclick="openAuthModal()">Sign In / Register</button>
    </header>

    <main>
      <div class="form-group">
        <label for="reel-category">Select Reel Category</label>
        <select id="reel-category">
          <option value="" disabled selected>Choose a category</option>
          <option value="fitness">Fitness & Health</option>
          <option value="tech">Tech & Gadgets</option>
          <option value="lifestyle">Lifestyle & Vlogs</option>
          <option value="business">Business & Finance</option>
        </select>
      </div>
    </main>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      
      <!-- Step 1: Login / Register Form -->
      <div id="auth-form-step" class="step-section active">
        <h3 class="modal-title" id="auth-title">Sign In</h3>
        <form id="main-auth-form" onsubmit="handleAuthSubmit(event)">
          <div class="form-group" id="name-group" style="display: none;">
            <label for="user-name">Full Name</label>
            <input type="text" id="user-name" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="user-email">Email or Phone</label>
            <input type="text" id="user-email" required placeholder="example@mail.com">
          </div>
          <div class="form-group">
            <label for="user-password">Password</label>
            <input type="password" id="user-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="submit-btn" id="auth-submit-btn">Sign In</button>
        </form>

        <div class="toggle-auth">
          <span id="auth-toggle-text" onclick="toggleAuthMode()">Don't have an account? Register</span>
        </div>
      </div>

      <!-- Step 2: OTP Verification -->
      <div id="otp-form-step" class="step-section">
        <h3 class="modal-title">Verify OTP</h3>
        <p style="font-size: 13px; color: #ccc; text-align: center;">Enter the 4-digit code sent to your registered contact.</p>
        <form onsubmit="handleOtpSubmit(event)">
          <div class="form-group">
            <input type="text" id="otp-input" maxlength="4" placeholder="1234" style="text-align: center; letter-spacing: 5px; font-size: 20px;" required>
          </div>
          <button type="submit" class="submit-btn">Verify & Complete Registration</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let isRegisterMode = false;
    let isLoggedIn = false;

    function openAuthModal() {
      if (isLoggedIn) {
        // Logout logic
        isLoggedIn = false;
        document.getElementById('auth-trigger-btn').innerText = "Sign In / Register";
        alert("You have logged out.");
        return;
      }
      document.getElementById('auth-modal').classList.add('active');
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.remove('active');
      resetAuthSteps();
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('auth-title');
      const submitBtn = document.getElementById('auth-submit-btn');
      const toggleText = document.getElementById('auth-toggle-text');
      const nameGroup = document.getElementById('name-group');

      if (isRegisterMode) {
        title.innerText = "Register Account";
        submitBtn.innerText = "Send OTP";
        toggleText.innerText = "Already have an account? Sign In";
        nameGroup.style.display = "block";
      } else {
        title.innerText = "Sign In";
        submitBtn.innerText = "Sign In";
        toggleText.innerText = "Don't have an account? Register";
        nameGroup.style.display = "none";
      }
    }

    function handleAuthSubmit(event) {
      event.preventDefault();
      if (isRegisterMode) {
        // Switch to OTP step
        document.getElementById('auth-form-step').classList.remove('active');
        document.getElementById('otp-form-step').classList.add('active');
      } else {
        // Simulate Direct Login
        isLoggedIn = true;
        document.getElementById('auth-trigger-btn').innerText = "Account / Logout";
        closeAuthModal();
        alert("Logged in successfully!");
      }
    }

    function handleOtpSubmit(event) {
      event.preventDefault();
      const otpVal = document.getElementById('otp-input').value;
      if (otpVal.length === 4) {
        isLoggedIn = true;
        document.getElementById('auth-trigger-btn').innerText = "Account / Logout";
        closeAuthModal();
        alert("Registration complete! You are now logged in.");
      } else {
        alert("Please enter a valid 4-digit OTP.");
      }
    }

    function resetAuthSteps() {
      document.getElementById('auth-form-step').classList.add('active');
      document.getElementById('otp-form-step').classList.remove('active');
    }
  </script>
</body>
</html>
