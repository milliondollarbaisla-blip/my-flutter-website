<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <title>LINELEAK</title>
  <script src="https://cdn.jsdelivr.net/npm/dartapp@latest/dartapp.js"></script>
  <script src="https://www.gstatic.com/flutter-canvaskit/3.19.0/canvaskit.js"></script>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/gh/flutter/flutter@master/bin/cache/flutter_web_sdk/flutter.js"></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
